name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, unit tests and lint
    # macOS 26 on Apple silicon, which ships the Xcode this project is
    # developed against. Free for public repositories.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Printed rather than pinned. Pinning a version breaks the day the image
      # drops it; printing means a failure caused by a toolchain change is
      # obvious from the log.
      - name: Report the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      # The probe starts from a load-time constructor that nothing references.
      # If the linker ever drops it the library still loads, no observer is
      # registered, and every oracle reports "not playing" — a silent failure
      # that would look like a passing test suite.
      - name: Verify the probe library
        run: Scripts/verify-probe-dylib.sh "$(swift build --show-bin-path)/libPlaybackProbe.dylib"

      # Both are pinned rather than taken from the runner image or from
      # Homebrew. A formatter that changes version changes its default rules,
      # and a lint failure that appears without anyone touching the code is a
      # waste of everyone's afternoon. Bumping these is a deliberate commit
      # that carries the reformatting with it.
      - name: Install the pinned formatter and linter
        env:
          SWIFTFORMAT_VERSION: 0.58.7
          SWIFTLINT_VERSION: 0.62.2
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          unzip -qo "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          find "$RUNNER_TEMP/swiftformat" -name swiftformat -type f -perm +111 \
            -exec cp {} "$RUNNER_TEMP/tools/swiftformat" \;
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          unzip -qo "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          cp "$RUNNER_TEMP/swiftlint/swiftlint" "$RUNNER_TEMP/tools/swiftlint"
          chmod +x "$RUNNER_TEMP/tools/"*
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          swiftformat --version
          swiftformat --lint .

      - name: Lint
        run: |
          swiftlint --version
          swiftlint --strict

  ui-tests:
    name: UI tests on the simulator
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -A5 'iOS'

      - name: Install XcodeGen
        run: brew install xcodegen

      # Built but not run: the capture app is the audio oracle's permanent
      # home, and a compile break in it would otherwise only surface on
      # someone's desk.
      - name: Build the capture app
        run: |
          cd Apps/CaptureApp
          xcodegen generate
          xcodebuild build -project PlaybackProbeCapture.xcodeproj \
            -scheme PlaybackProbeCapture -destination 'platform=macOS'

      # The audio oracle is deliberately not exercised here. It needs audio
      # capture permission, which macOS only grants interactively, and a
      # simulator booted without Simulator.app produces no sound at all. Those
      # tests skip on their own rather than failing.
      - name: Run the demo's UI tests
        env:
          PLAYBACK_PROBE_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=latest
        run: Scripts/run-demo-tests.sh -resultBundlePath TestResults.xcresult

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
